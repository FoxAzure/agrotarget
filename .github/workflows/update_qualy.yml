name: QualyFlow Sync Bot

on:
  schedule:
    # 07:00, 13:00, 19:00, 20:00 BRT (10:00, 16:00, 22:00, 23:00 UTC)
    - cron: '0 10,16,22,23 * * *'
    # Janela de pico: 17h, 17:15, 17:30, 17:45 BRT (20h UTC nos minutos correspondentes)
    - cron: '0,15,30,45 20 * * *'
    # 23:00 BRT (02:00 UTC do dia seguinte)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-process:
    runs-on: ubuntu-latest
    steps:
      - name: Puxar o código fonte
        uses: actions/checkout@v4

      - name: Preparar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Executar o Extrator da Umeko
        run: python scripts/sync_agrotarget.py

      - name: Commit e Push para a Vercel compilar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/qualyflow.db
          git add src/data/mockData.json
          git add src/data/qualy_update.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "[BOT]: Dados do QualyFlow Atualizados" && git push)