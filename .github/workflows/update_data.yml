name: Atualizar Dados COA

on:
  schedule:
    # Horários cravados de Brasília: 00h, 12h e 18h (Convertidos para UTC: 03h, 15h, 21h)
    - cron: '0 3,15,21 * * *' 
    # Horários de pico de Brasília: 09h e 10h a cada 15 minutos (Convertidos para UTC: 12h e 13h)
    - cron: '0,15,30,45 12,13 * * *'
  workflow_dispatch:

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    
    steps:
      - name: Puxar o código fonte
        uses: actions/checkout@v4

      - name: Preparar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Executar o Extrator da Umeko
        run: python scripts/atualizar_dados.py

      - name: Commit e Push para a Vercel compilar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/mockData_coa.json
          git add src/data/coa_update.json
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "[BOT]: Dados do COA Center Atualizados" && git push)