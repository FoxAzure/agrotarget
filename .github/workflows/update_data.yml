name: Atualizar Dados COA

on:
  schedule:
    # 08:00 BRT
    - cron: '0 11 * * *'
    # 09:00 até 12:00 BRT a cada 15 minutos (12:00 às 15:00 UTC)
    - cron: '0,15,30,45 12,13,14,15 * * *'
    # 18:00, 22:00 e 02:00 BRT (21:00, 01:00, 05:00 UTC)
    - cron: '0 1,5,21 * * *'
  workflow_dispatch:

jobs:
  atualizar-base:
    runs-on: ubuntu-latest
    steps:
      - name: Puxar o código fonte
        uses: actions/checkout@v4

      - name: Preparar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Executar o Extrator da Umeko
        run: python scripts/atualizar_dados.py

      - name: Commit e Push para a Vercel compilar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/mockData_coa.json
          git add src/data/coa_update.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "[BOT]: Dados do COA Center Atualizados" && git push)